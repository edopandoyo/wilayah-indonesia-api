name: wilayah-indonesia

services:
  db:
    image: postgres:16-alpine
    container_name: wilayah_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wilayah_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-wilayah_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: wilayah_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_setup:
    image: alpine:latest
    container_name: wilayah_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      apk add --no-cache curl tar;
      curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc;
      chmod +x /usr/local/bin/mc;
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/${MINIO_BUCKET_NAME:-wilayah-logo} --ignore-existing;
      mc anonymous set download myminio/${MINIO_BUCKET_NAME:-wilayah-logo};
      echo 'Downloading logo archive (tar.gz) from GitHub repository...';
      curl -sSL https://github.com/cahyadsn/wilayah_logo/archive/refs/heads/main.tar.gz -o /tmp/logo.tar.gz;
      mkdir -p /tmp/logo_extracted;
      tar -xzf /tmp/logo.tar.gz -C /tmp/logo_extracted;
      echo 'Uploading province logos to MinIO...';
      mc cp --recursive /tmp/logo_extracted/wilayah_logo-main/prov/img/ myminio/${MINIO_BUCKET_NAME:-wilayah-logo}/;
      echo 'Uploading regency logos to MinIO...';
      for f in /tmp/logo_extracted/wilayah_logo-main/kab/*/img/*.png; do
        if [ -f \"$$f\" ]; then
          mc cp \"$$f\" myminio/${MINIO_BUCKET_NAME:-wilayah-logo}/;
        fi;
      done;
      rm -rf /tmp/logo.tar.gz /tmp/logo_extracted;
      echo 'MinIO setup and logo sync completed successfully!';
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: wilayah_api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-wilayah_db}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost/wilayah-logo}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_MINIO_PUBLIC_URL: ${VITE_MINIO_PUBLIC_URL:-}
    container_name: wilayah_web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
