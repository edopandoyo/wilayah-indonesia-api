services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wilayah_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-wilayah_db}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio_setup:
    image: alpine:latest
    restart: always
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      apk add --no-cache curl tar;
      curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc;
      chmod +x /usr/local/bin/mc;
      echo 'Setting MinIO alias...';
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} || mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/${MINIO_BUCKET_NAME:-wilayah-logo} --ignore-existing;
      mc anonymous set download myminio/${MINIO_BUCKET_NAME:-wilayah-logo} || mc anonymous set public myminio/${MINIO_BUCKET_NAME:-wilayah-logo};
      echo 'Downloading logo archive (tar.gz) from GitHub repository...';
      curl -sSL https://github.com/cahyadsn/wilayah_logo/archive/refs/heads/main.tar.gz -o /tmp/logo.tar.gz;
      mkdir -p /tmp/logo_extracted;
      tar -xzf /tmp/logo.tar.gz -C /tmp/logo_extracted;
      echo 'Uploading all province and regency logos to MinIO...';
      find /tmp/logo_extracted/wilayah_logo-main/ -type f -name \"*.png\" ! -name \"*_thumbs*\" | xargs -I {} mc cp {} myminio/${MINIO_BUCKET_NAME:-wilayah-logo}/;
      echo 'Re-enforcing public download policy on MinIO bucket...';
      mc anonymous set download myminio/${MINIO_BUCKET_NAME:-wilayah-logo} || mc anonymous set public myminio/${MINIO_BUCKET_NAME:-wilayah-logo};
      rm -rf /tmp/logo.tar.gz /tmp/logo_extracted;
      echo 'MinIO setup and logo sync completed successfully!';
      sleep infinity;
      "

  db_setup:
    image: alpine:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      apk add --no-cache curl postgresql16-client gzip;
      export PGPASSWORD=$${DB_PASSWORD:-postgres};
      echo 'Checking PostgreSQL database tables and auto-seeding if missing...';
      psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db} -c 'CREATE TABLE IF NOT EXISTS wilayah_kodepos (kode VARCHAR(13) PRIMARY KEY, kodepos VARCHAR(5));';
      psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db} -c 'CREATE INDEX IF NOT EXISTS kodepos_idx ON wilayah_kodepos (kodepos);';
      
      KODEPOS_COUNT=$$(psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db} -t -c 'SELECT count(*) FROM wilayah_kodepos;' 2>/dev/null | tr -d ' ');
      if [ -z \"$$KODEPOS_COUNT\" ] || [ \"$$KODEPOS_COUNT\" -eq \"0\" ]; then
        echo 'Seeding 83,762 Kode Pos records into PostgreSQL...';
        curl -sSL https://raw.githubusercontent.com/edopandoyo/wilayah-indonesia-api/preview/init-db/07-kodepos.sql | psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db};
        echo 'Kode Pos seeding completed!';
      else
        echo \"Kode Pos data verified ($$KODEPOS_COUNT rows).\";
      fi;

      BOUNDARIES_COUNT=$$(psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db} -t -c 'SELECT count(*) FROM wilayah_boundaries;' 2>/dev/null | tr -d ' ');
      if [ -z \"$$BOUNDARIES_COUNT\" ] || [ \"$$BOUNDARIES_COUNT\" -eq \"0\" ]; then
        echo 'Seeding 41,406 GeoJSON Boundaries records into PostgreSQL...';
        curl -sSL https://raw.githubusercontent.com/edopandoyo/wilayah-indonesia-api/preview/init-db/03-boundaries-part1.sql.gz | gzip -dc | psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db};
        curl -sSL https://raw.githubusercontent.com/edopandoyo/wilayah-indonesia-api/preview/init-db/04-boundaries-part2.sql.gz | gzip -dc | psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db};
        curl -sSL https://raw.githubusercontent.com/edopandoyo/wilayah-indonesia-api/preview/init-db/05-boundaries-part3.sql.gz | gzip -dc | psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db};
        curl -sSL https://raw.githubusercontent.com/edopandoyo/wilayah-indonesia-api/preview/init-db/06-boundaries-part4.sql.gz | gzip -dc | psql -h db -U $${DB_USERNAME:-postgres} -d $${DB_NAME:-wilayah_db};
        echo 'Boundaries seeding completed!';
      else
        echo \"Boundaries data verified ($$BOUNDARIES_COUNT rows).\";
      fi;
      echo 'Database verification and auto-seeding completed successfully!';
      sleep infinity;
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      API_INTERNAL_PORT: 3000
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-wilayah_db}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost/wilayah-logo}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_MINIO_PUBLIC_URL: ${VITE_MINIO_PUBLIC_URL:-}
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
