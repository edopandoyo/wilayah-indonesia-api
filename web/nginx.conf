client_header_buffer_size 64k;
large_client_header_buffers 4 64k;
client_max_body_size 100M;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json application/geo+json application/vnd.geo+json text/plain text/css application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /wilayah-logo/ {
        proxy_pass http://minio:9000/wilayah-logo/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # MinIO Logo Caching & Egress Tuning (30 Days Edge/Browser Cache)
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable";
        expires 30d;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

